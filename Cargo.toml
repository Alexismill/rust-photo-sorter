[package]
name = "photo-sorter"
version = "0.1.0"
edition = "2021"
authors = ["Alexismill"]
description = "Keyboard-driven desktop app for triaging photos into folders"
license = "MIT"
repository = "https://github.com/Alexismill/rust-photo-sorter"
readme = "README.md"
keywords = ["photo", "gui", "egui", "images"]
categories = ["multimedia::images"]

[build-dependencies]
# Embeds the icon and version metadata into the .exe (Windows only).
winresource = "0.1"

[dependencies]
eframe = { version = "0.36", features = ["persistence"] }
egui = { version = "0.36", features = ["serde"] }
image = { version = "0.25", features = ["jpeg", "png", "webp", "tiff", "bmp", "gif"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }

# Image decoding is very slow unoptimised: optimise dependencies even in
# debug builds.
[profile.dev.package."*"]
opt-level = 3

# Smaller binary (28.4 MB -> 18.3 MB on Linux) at the cost of a release
# build taking minutes instead of seconds.
[profile.release]
lto = true
codegen-units = 1
strip = true
